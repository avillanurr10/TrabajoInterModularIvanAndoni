<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECARTON - Registro</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
<div class="container">
    <!-- Logo -->
    <div class="logo-container">
        <img src="imagenes/logoApp.png" alt="DECARTON" class="logo">
    </div>
    
    <form action="/register" method="post">
        <div class="input-group">
            <label for="username">Nombre de Usuario:</label>
            <input type="text" id="username" name="username" required placeholder="Ej: deportista22">
        </div>
        
        <div class="input-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com">
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
            <div class="password-strength">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
        </div>
        
        <div class="input-group">
            <label for="confirm-password">Confirmar Contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" required placeholder="Vuelve a escribir tu contraseña">
        </div>

        <button type="submit">Crear Cuenta</button>
    </form>
    
   
    
    <p class="login-link">¿Ya tienes cuenta? <a href="/">Inicia sesión aquí</a></p>
</div>

<script src="register.js"></script>
</body>
</html>
